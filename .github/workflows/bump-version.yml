name: Bump Version on Merge

# Every merge into develop bumps the app version. The PR title (or label) picks the size:
#   [major] / label major → major, [minor] / label minor → minor, anything else → patch.
on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: read

jobs:
  bump-version:
    runs-on: ubuntu-latest
    # The bot's own bump commit must not trigger another bump.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Get merged PR number
        id: merged-pr
        run: |
          MSG=$(git log -1 --pretty=%s)
          echo "Head commit: $MSG"
          # Merge commit: "Merge pull request #123 from ..."; squash merge: "Title (#123)"
          if [[ "$MSG" =~ Merge\ pull\ request\ \#([0-9]+) ]] || [[ "$MSG" =~ \(\#([0-9]+)\)$ ]]; then
            echo "PR_NUMBER=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "Found PR number: ${BASH_REMATCH[1]}"
          else
            echo "PR_NUMBER=" >> "$GITHUB_OUTPUT"
            echo "No PR number found; defaulting to patch"
          fi

      - name: Get PR details
        if: steps.merged-pr.outputs.PR_NUMBER != ''
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.merged-pr.outputs.PR_NUMBER }};
            try {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              core.setOutput('title', pr.title);
              core.setOutput('labels', pr.labels.map((label) => label.name).join(' '));
            } catch (error) {
              console.log('Error fetching PR details:', error);
              core.setOutput('title', '');
              core.setOutput('labels', '');
            }

      - name: Determine version bump type
        id: bump-type
        env:
          PR_TITLE: ${{ steps.pr-details.outputs.title }}
          LABELS: ${{ steps.pr-details.outputs.labels }}
        run: |
          echo "PR Title: $PR_TITLE"
          echo "Labels: $LABELS"
          if [[ " $LABELS " == *" major "* ]] || [[ "$PR_TITLE" == *"[major]"* ]]; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif [[ " $LABELS " == *" minor "* ]] || [[ "$PR_TITLE" == *"[minor]"* ]]; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Run bump-version-up script
        run: bash ./bump-version-up.sh ${{ steps.bump-type.outputs.type }}

      - name: Commit version bump
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit"
            exit 0
          fi
          NEW_VERSION=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          git add src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git push origin develop
