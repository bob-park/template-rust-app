[package]
name = "template-rust-app"
version = "0.0.1"
edition = "2024"

[lib]
name = "template_rust_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-log = "2.10.0"
tauri-plugin-updater = "2.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
